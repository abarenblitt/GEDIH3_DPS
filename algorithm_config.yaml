algorithm_description: "Dynamic GEDI Pipeline: Downloads L2A, extracts RH98 for any BBox/Date, rasterizes to 2km."
algorithm_name: "gedi_rh98_dynamic_2km"
algorithm_version: "1.1.0"
build_command: "chmod +x run.sh"
run_command: "./run.sh"
disk_space: "50GB" 
inputs:
  config: []
  positional:
    - name: edl_username
      type: string
      required: true
    - name: edl_password
      type: string
      required: true
    - name: start_date
      type: string
      required: true
    - name: end_date
      type: string
      required: true
    - name: bbox
      type: string
      required: true